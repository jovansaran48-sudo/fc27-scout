name: Data probe (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe FUT.GG data
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"Mozilla/5.0 fc27-scout/1.0","Accept":"application/json"}
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30); b=r.read()
                  return r.status, b
              except Exception as e:
                  return str(e), b""
          def shape(v,d=0):
              if d>3: return type(v).__name__
              if isinstance(v,list): return ["len %d"%len(v)]+([shape(v[0],d+1)] if v else [])
              if isinstance(v,dict): return {k:shape(v[k],d+1) for k in list(v)[:25]} | {"_n":len(v)}
              return repr(v)[:60]
          out={}
          st,b=get("https://r2.fut.gg/27/manifest.json"); man=json.loads(b); out["manifest_keys"]=list(man)
          for k in ("misc-prices-ps5","player-prices-index"):
              st,b=get(f"https://r2.fut.gg/27/{k}.v1.{man[k]}.json")
              try: j=json.loads(b); out[k]={"status":st,"shape":shape(j),"sample":json.dumps(j)[:1500]}
              except Exception as e: out[k]={"status":st,"err":str(e)}
          for u in ["https://www.fut.gg/api/fut/players/v2/27/?page=1",
                    "https://www.fut.gg/api/fut/players/v2/search/?name=bellingham",
                    "https://www.fut.gg/api/fut/players/v2/27/?page=1&min_price=1000",
                    "https://www.fut.gg/api/fut/sbc/27/",
                    "https://www.fut.gg/api/fut/sbc/?game=27"]:
              st,b=get(u)
              try: j=json.loads(b); out[u]={"status":st,"shape":shape(j),"sample":json.dumps(j)[:1200]}
              except Exception as e: out[u]={"status":st,"bytes":len(b),"head":b[:200].decode("utf8","replace")}
          json.dump(out,open("probe.json","w"),indent=1)
          PY
      - name: Save results to the probe branch
        run: |
          cd out && git init -q && git checkout -q -b probe && git add probe.json
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
