name: Price check (one-off, read-only)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare FUT.GG prices for a few players
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"Mozilla/5.0 fc27-scout/1.0","Accept":"application/json"}
          get=lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read())
          R="https://r2.fut.gg/27/"; man=get(R+"manifest.json")
          idx=get(f"{R}player-prices-index.v1.{man['player-prices-index']}.json")
          ids=[idx["id0"]]
          for d in idx["d"]: ids.append(ids[-1]+d)
          pos={c:i for i,c in enumerate(ids)}
          dyn=get(f"{R}player-prices-ps5-dyn.v1.{man['player-prices-ps5-dyn']}.json")
          sta=get(f"{R}player-prices-ps5.v1.{man['player-prices-ps5']}.json")
          pc=get(f"{R}player-prices-pc-dyn.v1.{man['player-prices-pc-dyn']}.json")
          out={"len":[len(ids),len(dyn["p"]),len(sta["p"])], "spp":idx.get("spp"), "sps":idx.get("sps"), "players":{}}
          for base in [264652, 251313, 233373, 83499, 231747]:
              vs=get(f"https://www.fut.gg/api/fut/players/v2/all-versions/{base}/")["data"]
              rows=[]
              for v in vs:
                  if str(v.get("game"))!="27": continue
                  e=v["eaId"]; i=pos.get(e)
                  rows.append({"eaId":e,"ovr":v.get("overall"),"rarity":v.get("rarityEaId"),"untradeable":v.get("isUntradeable"),
                               "sbc":v.get("isSbcItem"),"obj":v.get("isObjectiveItem"),"hasPrice":v.get("hasPrice"),
                               "ps5_dyn":dyn["p"][i] if i is not None else None,"ps5_static":sta["p"][i] if i is not None else None,
                               "pc_dyn":pc["p"][i] if i is not None else None,"status":dyn["s"][i] if i is not None else None})
              out["players"][base]=rows
          json.dump(out,open("probe.json","w"),indent=1)
          PY
      - name: Save results
        run: |
          cd out && git init -q && git checkout -q -b probe && git add probe.json
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
